name: CLA

# Asks each first-time contributor to accept CLA.md by commenting on their pull request, and keeps the
# check red until every commit author has. Signatures live on the cla-signatures branch, not main.
#
# pull_request_target runs with this repository's token, so this workflow must never check out or run
# code from the pull request. It only reads PR metadata and comments.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    name: Contributor License Agreement
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-26.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/DiffCI/core/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: adityankale190895,dependabot[bot],github-actions[bot],*[bot]
          signed-commit-message: "cla: $contributorName signed the CLA in #$pullRequestNo"
          create-file-commit-message: "cla: start the signature record"
          custom-notsigned-prcomment: >-
            Thank you for contributing to DiffCI Core. Before this can be merged, each commit author needs
            to accept the [Contributor License Agreement](https://github.com/DiffCI/core/blob/main/CLA.md)
            once. You keep the copyright in your work; the agreement lets DiffCI keep distributing it under
            the MIT License and other terms. To accept, comment the line below on this pull request.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have accepted the DiffCI Contributor License Agreement.
