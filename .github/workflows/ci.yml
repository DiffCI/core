name: Core CI
on:
  push:
  pull_request:
  # The safety net for selective runs: the full suite every night and on demand. A failure here on a
  # commit whose push run passed with a narrowed selection is a DiffCI miss; record it as one.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
# DiffCI's own CI and release smoke runs are not usage; keep them out of the counts (docs/telemetry.md).
env:
  DO_NOT_TRACK: "1"

jobs:
  # Core runs on its own selection: the published CLI decides which root test files a push or pull
  # request affects, and `check` runs only those. It runs everything whenever DiffCI is unsure, when
  # this job fails, and on the nightly schedule.
  plan:
    name: Plan affected tests
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    outputs:
      full-suite-required: ${{ steps.observe.outputs.full-suite-required }}
      affected-tests: ${{ steps.observe.outputs.affected-tests }}
      total-test-count: ${{ steps.observe.outputs.total-test-count }}
      reason: ${{ steps.observe.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the published CLI release
        id: published_cli
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @diffci.com/diffci@latest version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: observe
        uses: ./
        with:
          cli-version: ${{ steps.published_cli.outputs.version }}
          upload-artifact: "false"
          update-notice: "false"

  check:
    needs: plan
    # Also when planning failed or was skipped: the test step then runs the full suite.
    if: ${{ !cancelled() }}
    env:
      # The real Cargo execution fixture (tests/repo/rust-execution.test.ts) builds workspaces; one
      # Linux job proves it and fails if Cargo is missing, the other matrix entries skip it.
      DIFFCI_REQUIRE_CARGO: ${{ matrix.os == 'ubuntu-26.04' && matrix.node == 24 && '1' || '0' }}
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify Cargo is available for Rust metadata fixtures
        run: cargo --version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Test the affected files (everything when DiffCI is unsure)
        env:
          DIFFCI_FULL: ${{ needs.plan.outputs.full-suite-required }}
          DIFFCI_TESTS: ${{ needs.plan.outputs.affected-tests }}
          DIFFCI_TOTAL: ${{ needs.plan.outputs.total-test-count }}
          DIFFCI_REASON: ${{ needs.plan.outputs.reason }}
        run: node scripts/ci-selected-tests.mjs
      - run: npm run build
      - run: npm run audit:boundary
      - run: npm run agent:check
      - run: npm run benchmark

  observer-action:
    name: Observer Action smoke
    # A nightly or manual run has no change to observe.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the published CLI release
        id: published_cli
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @diffci.com/diffci@latest version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: observe
        uses: ./
        with:
          # The Action defaults to the release candidate. Smoke the last published
          # CLI until that candidate is published, avoiding a pre-publish cycle.
          cli-version: ${{ steps.published_cli.outputs.version }}
          upload-artifact: "false"
          redact-paths: "true"
          fail-on-error: "true"
      - name: Assert observer receipt
        shell: bash
        env:
          DIFFCI_STATUS: ${{ steps.observe.outputs.status }}
          DIFFCI_REPORT_PATH: ${{ steps.observe.outputs.report-path }}
          DIFFCI_FULL: ${{ steps.observe.outputs.full-suite-required }}
          DIFFCI_TESTS: ${{ steps.observe.outputs.affected-tests }}
          DIFFCI_TOTAL: ${{ steps.observe.outputs.total-test-count }}
        run: |
          set -euo pipefail
          test "$DIFFCI_STATUS" = "OBSERVED"
          case "$DIFFCI_FULL" in true|false) ;; *) echo "full-suite-required must be true or false" >&2; exit 1 ;; esac
          # redact-paths is on, so the test list must stay empty rather than become a list of digests.
          test -z "$DIFFCI_TESTS"
          test -n "$DIFFCI_TOTAL"
          test -n "$DIFFCI_REPORT_PATH"
          test -f "$DIFFCI_REPORT_PATH"
          case "$DIFFCI_REPORT_PATH" in
            "$GITHUB_WORKSPACE"/*)
              echo "Observer report must be outside the checkout" >&2
              exit 1
              ;;
          esac

  observer-action-shallow:
    name: Observer Action smoke (shallow checkout)
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      # The default one-commit clone: the Action must fetch the base commit itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the published CLI release
        id: published_cli
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @diffci.com/diffci@latest version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: observe
        uses: ./
        with:
          cli-version: ${{ steps.published_cli.outputs.version }}
          upload-artifact: "false"
          fail-on-error: "true"
      - name: Assert the shallow checkout was observed
        shell: bash
        env:
          DIFFCI_STATUS: ${{ steps.observe.outputs.status }}
        run: |
          set -euo pipefail
          test "$DIFFCI_STATUS" = "OBSERVED"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"

  # The merge gate on Core's own pull requests: the fast check runs the affected tests with the published
  # CLI, and this checkout's Action posts the "DiffCI merge gate" check run on the head commit.
  merge-gate:
    name: Merge gate smoke
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Only to post the check run. Pull requests from forks get a read-only token and a warning instead.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the checks: write token out of .git/config while npm ci runs install scripts. The
          # Action posts the check run with its github-token input, not with git.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/diffci-cli/package-lock.json
      - run: npm ci --ignore-scripts
      # The CLI's own tests compile it with the CLI package's TypeScript, and the gate can select them.
      # Scripts stay on: the pinned @diffci.com/core git dependency builds its dist/ in `prepare`.
      - working-directory: packages/diffci-cli
        run: npm ci --no-audit --fund=false
      - name: Resolve the published CLI release
        id: published_cli
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @diffci.com/diffci@latest version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: ./
        with:
          cli-version: ${{ steps.published_cli.outputs.version }}
          node-version: "24"
          upload-artifact: "false"
          verify: "true"
          check-run: "true"
      - name: Assert the gate answered
        if: ${{ always() }}
        shell: bash
        env:
          DIFFCI_CONCLUSION: ${{ steps.gate.outputs.gate-conclusion }}
          DIFFCI_AGENT: ${{ steps.gate.outputs.agent }}
          DIFFCI_VERIFY: ${{ steps.gate.outputs.verify-status }}
        run: |
          set -euo pipefail
          echo "verify=$DIFFCI_VERIFY gate=$DIFFCI_CONCLUSION agent=$DIFFCI_AGENT"
          case "$DIFFCI_CONCLUSION" in success|failure|neutral) ;; *) echo "the gate gave no conclusion" >&2; exit 1 ;; esac
          test -n "$DIFFCI_AGENT"

  cli-package:
    name: CLI package (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_SSH_COMMAND: ${{ matrix.os == 'windows-latest' && 'cmd.exe /d /s /c exit 1' || '/bin/false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/diffci-cli/package-lock.json
      - working-directory: packages/diffci-cli
        run: npm ci --no-audit --fund=false
      - working-directory: packages/diffci-cli
        run: npm run typecheck
      # The root `npm test` covers Core only. Without this step the CLI's own tests ran on Linux only
      # when the merge gate happened to select them.
      - working-directory: packages/diffci-cli
        run: npm test
      - working-directory: packages/diffci-cli
        run: npm run build
      - working-directory: packages/diffci-cli
        run: npm run package:check
      - working-directory: packages/diffci-cli
        run: npm run package:smoke
