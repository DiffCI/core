name: Core CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:boundary
      - run: npm run agent:check
      - run: npm run benchmark

  observer-action:
    name: Observer Action smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: observe
        uses: ./
        with:
          # The Action defaults to the release candidate. Smoke the last published
          # CLI until that candidate is published, avoiding a pre-publish cycle.
          cli-version: "0.3.12"
          upload-artifact: "false"
          redact-paths: "true"
          fail-on-error: "true"
      - name: Assert observer receipt
        shell: bash
        env:
          DIFFCI_STATUS: ${{ steps.observe.outputs.status }}
          DIFFCI_REPORT_PATH: ${{ steps.observe.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$DIFFCI_STATUS" = "OBSERVED"
          test -n "$DIFFCI_REPORT_PATH"
          test -f "$DIFFCI_REPORT_PATH"
          case "$DIFFCI_REPORT_PATH" in
            "$GITHUB_WORKSPACE"/*)
              echo "Observer report must be outside the checkout" >&2
              exit 1
              ;;
          esac

  cli-package:
    name: CLI package (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_SSH_COMMAND: ${{ matrix.os == 'windows-latest' && 'cmd.exe /d /s /c exit 1' || '/bin/false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/diffci-cli/package-lock.json
      - working-directory: packages/diffci-cli
        run: npm ci --no-audit --fund=false
      - working-directory: packages/diffci-cli
        run: npm run typecheck
      - working-directory: packages/diffci-cli
        run: npm run build
      - working-directory: packages/diffci-cli
        run: npm run package:check
      - working-directory: packages/diffci-cli
        run: npm run package:smoke
