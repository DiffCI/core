name: Publish CLI

on:
  push:
    tags:
      - "cli-release-v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish @diffci.com/diffci
    runs-on: ubuntu-26.04
    env:
      GIT_SSH_COMMAND: /bin/false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/diffci-cli/package-lock.json

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11

      - name: Require an exact release tag
        working-directory: packages/diffci-cli
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          expected="cli-release-v$version"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Install CLI dependencies
        working-directory: packages/diffci-cli
        run: npm ci --no-audit --fund=false

      - name: Verify cross-agent package metadata
        run: node scripts/check-agent-packaging.mjs

      - name: Verify the release package
        working-directory: packages/diffci-cli
        run: |
          npm run typecheck
          npm run build
          npm run package:check
          npm run package:smoke

      - name: Refuse an already-published version
        id: npm_version
        working-directory: packages/diffci-cli
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Refusing to republish $package_name@$package_version" >&2
            exit 1
          fi

      - name: Publish with npm trusted publishing
        working-directory: packages/diffci-cli
        run: npm publish --access public --provenance

      - name: Wait for npm registry propagation
        working-directory: packages/diffci-cli
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          for attempt in {1..30}; do
            published_version=$(npm view "$package_name@$package_version" version 2>/dev/null || true)
            if [ "$published_version" = "$package_version" ]; then
              exit 0
            fi
            echo "Waiting for $package_name@$package_version on npm ($attempt/30)"
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "$package_name@$package_version was not available from npm after 290 seconds" >&2
          exit 1

      - name: Resolve the release smoke range
        id: release_smoke_range
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Smoke the published observer Action
        id: observe
        uses: ./
        with:
          base-sha: ${{ steps.release_smoke_range.outputs.base }}
          head-sha: ${{ github.sha }}
          upload-artifact: "false"
          redact-paths: "true"
          fail-on-error: "true"

      - name: Assert observer receipt
        shell: bash
        env:
          DIFFCI_STATUS: ${{ steps.observe.outputs.status }}
          DIFFCI_REPORT_PATH: ${{ steps.observe.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$DIFFCI_STATUS" = "OBSERVED"
          test -n "$DIFFCI_REPORT_PATH"
          test -f "$DIFFCI_REPORT_PATH"

      - name: Create the GitHub Release
        working-directory: packages/diffci-cli
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          release_tag="v$package_version"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $release_tag already exists"
            exit 0
          fi
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --latest \
            --notes "npm: \`$package_name@$package_version\`" \
            --generate-notes

      - name: Tag the matching observer Action release
        working-directory: packages/diffci-cli
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action_tag="action-v$(node -p "require('./package.json').version")"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$action_tag" >/dev/null 2>&1; then
            echo "Tag $action_tag already exists"
            exit 0
          fi
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$action_tag" \
            -f message="Release DiffCI observer Action ${action_tag#action-}" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$action_tag" -f sha="$tag_object" >/dev/null

      - name: Verify npm, GitHub Release and tags agree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs --surfaces=npm,github-release,tags
