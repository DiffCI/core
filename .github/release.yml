# Sections for the notes `gh release create --generate-notes` writes (release-cli.yml).
# Contributors are thanked by name at the top of each release by scripts/release-notes.mjs;
# this only lists the pull requests merged since the previous release.
changelog:
  exclude:
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Merged pull requests
      labels:
        - "*"
