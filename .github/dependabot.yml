version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/packages/diffci-cli"]
    schedule:
      interval: weekly
    # Only versions that have been public for two weeks.
    cooldown:
      default-days: 14
    ignore:
      # Pinned by commit to the Core release the CLI ships with; bumped by hand at release time.
      - dependency-name: "@diffci.com/core"
      # The engine builds its graph with the TypeScript compiler API; a major version is a migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Types track the oldest supported Node (engines: >=22.5).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
