version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/packages/diffci-cli"]
    schedule:
      interval: weekly
    # Only versions that have been public for two weeks.
    cooldown:
      default-days: 14
    ignore:
      # Pinned by commit to the Core release the CLI ships with; bumped by hand at release time.
      - dependency-name: "@diffci.com/core"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
