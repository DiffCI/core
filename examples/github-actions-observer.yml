name: DiffCI observer

on:
  pull_request:

permissions:
  contents: read
  # Only for comment: "true" below. Fork pull requests get a read-only token and a warning instead.
  pull-requests: write

jobs:
  diffci-observer:
    # The Action is advisory: DiffCI must not replace or block required CI.
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DiffCI refuses without the base revision available locally.
          fetch-depth: 0
      - uses: DiffCI/core@<reviewed-core-release-or-commit>
        with:
          redact-paths: "true"
          artifact-retention-days: "7"
          comment: "true"
