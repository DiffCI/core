# Copy into the evaluated repository after configuring its test:junit script.
# Full-suite results remain authoritative; no tests are skipped by this workflow.
name: Check DiffCI selection against the full suite

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-plan:
    runs-on: ubuntu-26.04
    env:
      # Pinned like the DiffCI GitHub Action. Bump it after reviewing a new CLI release.
      DIFFCI_CLI_VERSION: "0.3.42"
    steps:
      - name: Check out the scheduled revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install target dependencies
        id: target-setup
        working-directory: target
        run: npm ci

      # Installed outside the checkout so npm never touches the repository being planned.
      - name: Install the published DiffCI CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/diffci" --ignore-scripts --no-audit --fund=false \
            "@diffci.com/diffci@$DIFFCI_CLI_VERSION"
          echo "$RUNNER_TEMP/diffci/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Save the advisory plan for this revision
        id: plan
        working-directory: target
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD^)
          test "$HEAD" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          diffci plan --repo "$PWD" --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/plan.json"

      - name: Prepare the plan's base revision
        id: base-setup
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        working-directory: target
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$(git rev-parse HEAD^)"
          npm ci --prefix "$RUNNER_TEMP/base"

      - name: Run the base full suite with the same reporter
        id: base-full
        if: ${{ !cancelled() && steps.base-setup.outcome == 'success' }}
        continue-on-error: true # An old failing suite is valid comparison evidence.
        env:
          DIFFCI_JUNIT_FILE: ${{ runner.temp }}/base-junit.xml
        run: |
          cd "$RUNNER_TEMP/base"
          npm run test:junit

      - name: Run the complete suite with JUnit reporting
        id: full
        if: ${{ !cancelled() && steps.target-setup.outcome == 'success' }}
        working-directory: target
        env:
          DIFFCI_JUNIT_FILE: ${{ runner.temp }}/junit.xml
        run: npm run test:junit

      # Set --root to the runner root relative to target if it is not the repository root.
      - name: Compare failures even when the full suite failed
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.base-setup.outcome == 'success' && (steps.base-full.outcome == 'success' || steps.base-full.outcome == 'failure') && (steps.full.outcome == 'success' || steps.full.outcome == 'failure') }}
        run: |
          diffci check-plan \
            --repo "$GITHUB_WORKSPACE/target" --base-repo "$RUNNER_TEMP/base" --root . \
            --plan "$RUNNER_TEMP/plan.json" --results "$RUNNER_TEMP/junit.xml" \
            --base-results "$RUNNER_TEMP/base-junit.xml" \
            > "$RUNNER_TEMP/comparison.json"

      - name: Retain comparison evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffci-plan-comparison
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/base-junit.xml
            ${{ runner.temp }}/comparison.json
          if-no-files-found: warn
          retention-days: 14
