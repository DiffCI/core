name: DiffCI change impact
description: Verification for AI coding agents on every pull request. Shows which tests a change affects and why. Skips nothing.
branding:
  icon: eye
  color: gray-dark

inputs:
  repository-path:
    description: The checkout to observe. Defaults to the workspace.
    required: false
    default: ${{ github.workspace }}
  base-sha:
    description: Base commit. Leave empty to derive it from the event (pull request base, push before).
    required: false
    default: ""
  head-sha:
    description: Head commit. Must be given together with base-sha.
    required: false
    default: ""
  node-version:
    description: Node version used to run the observer. Only affects this job.
    required: false
    default: "22"
  cli-version:
    description: Exact published DiffCI CLI version to run.
    required: false
    default: "0.3.39"
  report-path:
    description: Where to write the report. Must be outside the checkout. Defaults to RUNNER_TEMP.
    required: false
    default: ""
  redact-paths:
    description: Replace every file path in the report with a stable 12-character digest.
    required: false
    default: "false"
  upload-artifact:
    description: Upload the report as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: diffci-observation
  artifact-retention-days:
    description: Retention for the uploaded artifact.
    required: false
    default: "7"
  api-url:
    description: >-
      DiffCI ingest endpoint. Leave empty and nothing is sent anywhere - the report stays on the runner
      as an artifact. Must be https.
    required: false
    default: ""
  api-token:
    description: >-
      Ingest token for this repository. Pass it as a repository secret, never as a literal. Nothing is
      sent without it.
    required: false
    default: ""
  fail-on-error:
    description: >-
      Fail this step when observation refuses or errors. Default false, so a DiffCI problem never becomes
      the workflow conclusion. Turn it on only while debugging an installation.
    required: false
    default: "false"
  comment:
    description: >-
      Also keep one comment on the pull request up to date with what the change affects. Off by default.
      Needs "permissions: pull-requests: write" on the job; pull requests from forks get a read-only token,
      so they get a warning instead of a comment. Never fails the step.
    required: false
    default: "false"
  github-token:
    description: Token used only to post the pull request comment when comment is true.
    required: false
    default: ${{ github.token }}
  verify:
    description: >-
      Also run the affected tests, likeliest failures first, and fail this step as soon as one fails
      (diffci verify --fail-fast). A fast first signal, not a replacement: keep your full test job, because
      this skips nothing there. It runs repository code, so install dependencies before this step. When
      DiffCI cannot narrow the change it runs nothing and leaves the change to the full test job. A DiffCI
      problem only warns; only failing tests or checks fail the step. Off by default.
    required: false
    default: "false"
  verify-checks:
    description: >-
      With verify, also run the repository's check script leaves (lint, typecheck) before the tests. Set
      "false" when other jobs already run them.
    required: false
    default: "true"
  verify-timeout-minutes:
    description: With verify, stop the run after this many minutes and report it blocked, not failed.
    required: false
    default: "20"

outputs:
  report-path:
    description: Absolute path of the written report.
    value: ${{ steps.observe.outputs.report-path }}
  status:
    description: OBSERVED, REFUSED, or ERROR.
    value: ${{ steps.observe.outputs.status }}
  full-suite-required:
    description: >-
      "false" only when DiffCI narrowed this change cleanly. "true" on any fallback, refusal, error or missing
      report, so a workflow that narrows on it falls back to the full suite whenever DiffCI is unsure.
    value: ${{ steps.impact.outputs.full-suite-required }}
  affected-tests:
    description: >-
      JSON array of the affected test files (repository-relative) when full-suite-required is "false".
      Empty when the full suite is required or redact-paths is on, so fromJSON fails rather than running nothing.
    value: ${{ steps.impact.outputs.affected-tests }}
  affected-test-count:
    description: Number of affected test files. Empty without an observation.
    value: ${{ steps.impact.outputs.affected-test-count }}
  total-test-count:
    description: Number of test files the full suite runs. Empty without an observation.
    value: ${{ steps.impact.outputs.total-test-count }}
  reason:
    description: One line on why the full suite is required. Empty when it is not.
    value: ${{ steps.impact.outputs.reason }}
  verify-status:
    description: >-
      With verify: passed, failed, blocked (DiffCI could not verify; the step only warns), or skipped (the
      change needs the full suite). Empty without verify.
    value: ${{ steps.verify.outputs.status }}

runs:
  using: composite
  steps:
    - name: Set up Node for the observer
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    # The published CLI is installed outside the observed checkout. That prevents npm from touching the
    # checkout's lockfile or node_modules, and --ignore-scripts prevents package lifecycle scripts from
    # running. This Action never changes jobs, and runs repository scripts only in the opt-in verify step.
    # actions/checkout clones one commit by default, which leaves out the base commit DiffCI compares
    # against. Fetch the missing history instead of making every installation add fetch-depth: 0. This
    # adds git objects only: the working tree, HEAD and branches are unchanged. If the fetch fails (for
    # example persist-credentials: false on a private repository), observe refuses and says what to add.
    - name: Fetch the history DiffCI compares
      id: history
      shell: bash
      env:
        DIFFCI_REPO: ${{ inputs.repository-path }}
      run: |
        set -uo pipefail
        if [ "$(git -C "$DIFFCI_REPO" rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          echo "The checkout is shallow; fetching its history so DiffCI can compare against the base commit."
          if ! git -C "$DIFFCI_REPO" fetch --quiet --no-tags --unshallow origin; then
            echo "::warning title=DiffCI::Could not fetch the base commit into the shallow checkout. Add fetch-depth: 0 to the actions/checkout step of this job."
          fi
        fi

    - name: Observe
      id: observe
      shell: bash
      env:
        DIFFCI_REPO: ${{ inputs.repository-path }}
        DIFFCI_BASE: ${{ inputs.base-sha }}
        DIFFCI_HEAD: ${{ inputs.head-sha }}
        DIFFCI_OUT: ${{ inputs.report-path }}
        DIFFCI_REDACT: ${{ inputs.redact-paths }}
        DIFFCI_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        DIFFCI_API_URL: ${{ inputs.api-url }}
        DIFFCI_TOKEN: ${{ inputs.api-token }}
        DIFFCI_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if [[ ! "$DIFFCI_CLI_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "DiffCI CLI version must be an exact semver version" >&2
          exit 2
        fi
        args=(observe --repo "$DIFFCI_REPO")
        if [ -n "$DIFFCI_BASE" ]; then args+=(--base "$DIFFCI_BASE"); fi
        if [ -n "$DIFFCI_HEAD" ]; then args+=(--head "$DIFFCI_HEAD"); fi
        if [ -n "$DIFFCI_OUT" ]; then args+=(--out "$DIFFCI_OUT"); fi
        if [ "$DIFFCI_REDACT" = "true" ]; then args+=(--redact-paths); fi
        if [ "$DIFFCI_FAIL_ON_ERROR" = "true" ]; then args+=(--fail-on-error); fi
        (
          cd "$RUNNER_TEMP"
          npx --yes --ignore-scripts --no-audit --fund=false --package "@diffci.com/diffci@$DIFFCI_CLI_VERSION" diffci "${args[@]}"
        )

    # Reads the written report only. The token reaches the script through the environment, and the
    # script never fails the step: outputs and the comment are conveniences, the artifact is the record.
    - name: Summarize change impact
      id: impact
      if: ${{ always() }}
      shell: bash
      env:
        DIFFCI_REPORT: ${{ steps.observe.outputs.report-path }}
        DIFFCI_COMMENT: ${{ inputs.comment }}
        DIFFCI_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/action/impact.mjs"

    # Opt-in fast check. It runs only what the observation narrowed to, so it never runs the whole suite
    # a second time next to the repository's own test job, and only a failing test or check fails it.
    - name: Verify the affected tests
      id: verify
      if: ${{ inputs.verify == 'true' && steps.observe.outcome == 'success' }}
      shell: bash
      env:
        DIFFCI_REPO: ${{ inputs.repository-path }}
        DIFFCI_BASE: ${{ inputs.base-sha }}
        DIFFCI_HEAD: ${{ inputs.head-sha }}
        DIFFCI_CLI_VERSION: ${{ inputs.cli-version }}
        DIFFCI_FULL: ${{ steps.impact.outputs.full-suite-required }}
        DIFFCI_REASON: ${{ steps.impact.outputs.reason }}
        DIFFCI_VERIFY_CHECKS: ${{ inputs.verify-checks }}
        DIFFCI_VERIFY_TIMEOUT: ${{ inputs.verify-timeout-minutes }}
      run: bash "$GITHUB_ACTION_PATH/action/verify.sh"

    - name: Upload observation report
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.observe.outputs.report-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.observe.outputs.report-path }}
          ${{ steps.verify.outputs.receipt-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: warn
